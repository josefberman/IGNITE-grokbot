[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ignite"
version = "0.1.0"
description = "Learned energetic-material generation with beam search, uncertainty, safety, and novelty"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.27.0,<1",
  "pydantic>=2.6.0,<3",
  "pydantic-settings>=2.2.0,<3",
  "python-dotenv>=1.0.0,<2",
  "numpy>=1.26.0,<3",
  "scipy>=1.10.0,<2",
  "pandas>=2.0.0,<3",
  "joblib>=1.3.0,<2",
  "rdkit>=2023.9.1,<2027",
  "xgboost>=2.0.0,<4",
  "scikit-learn>=1.3.0,<2",
  "sqlalchemy>=2.0.0,<3",
  "aiosqlite>=0.19.0,<1",
  "httpx>=0.27.0,<1",
  "sse-starlette>=2.0.0,<3",
  "requests>=2.31.0,<3",
  "Pillow>=10.0.0,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9", "pytest-asyncio>=0.23.0,<2"]
torch = ["torch>=2.1.0,<3"]
ml = ["ignite[torch]", "torch-geometric>=2.4.0,<3"]
literature = [
  "openai>=1.10.0,<2",
  "pubchempy>=1.0.4,<2",
  "transformers>=4.36.0,<5",
  "sentence-transformers>=2.2.0,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
