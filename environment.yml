# Conda environment for running IGNITE locally.
# Every third-party distribution declared in pyproject.toml is listed here too.
# Heavy / compiled packages come from conda-forge. Remaining packages (and this
# project in editable mode with the dev extras) are installed via pip.
#
# pytorch/torch is optional at runtime: the API falls back to the rule-based
# planner when torch or the checkpoint is missing. It is included here so a
# full local install can run the learned planner. Create from the repo root.
name: ignite
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10,<3.13
  - pip
  # compiled / numeric (core) — same pins as pyproject.toml
  - numpy>=1.26.0,<3
  - scipy>=1.10.0,<2
  - pandas>=2.0.0,<3
  - joblib>=1.3.0,<2
  - rdkit>=2023.9.1,<2027
  - xgboost>=2.0.0,<4
  - scikit-learn>=1.3.0,<2
  - pytorch>=2.1.0,<3  # pip distribution name: torch (extra: torch)
  - pillow>=10.0.0,<12
  - pip:
      # core (pure-Python / wheels; same pins as pyproject.toml)
      - fastapi>=0.110.0,<1
      - uvicorn[standard]>=0.27.0,<1
      - pydantic>=2.6.0,<3
      - pydantic-settings>=2.2.0,<3
      - python-dotenv>=1.0.0,<2
      - sqlalchemy>=2.0.0,<3
      - aiosqlite>=0.19.0,<1
      - httpx>=0.27.0,<1
      - sse-starlette>=2.0.0,<3
      - requests>=2.31.0,<3
      # extra: dev
      - pytest>=8.0.0,<9
      - pytest-asyncio>=0.23.0,<2
      # extra: ml
      - torch-geometric>=2.4.0,<3
      # extra: literature
      - openai>=1.10.0,<2
      - pubchempy>=1.0.4,<2
      - transformers>=4.36.0,<5
      - sentence-transformers>=2.2.0,<4
      # extra: sascore — BRSAScore>=0.1.1,<1 (lazy import in
      # backend/app/services/safety.py). Not installed by default: the
      # published wheel depends on rdkit-pypi, which conflicts with
      # conda-forge rdkit. Use a pip-only env: pip install -e ".[sascore]"
      - -e ".[dev]"
