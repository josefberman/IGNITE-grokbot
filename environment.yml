# Conda environment for running IGNITE locally.
# Heavy / compiled packages come from conda-forge; remaining Python deps
# (and this project in editable mode with test extras) are installed via pip
# to stay consistent with pyproject.toml / requirements.txt.
name: ignite
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10
  - pip
  - numpy>=1.26.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - joblib>=1.3.0
  - rdkit>=2023.9.1
  - xgboost>=2.0.0
  - scikit-learn>=1.3.0
  - pytorch>=2.1.0
  - pillow>=10.0.0
  - pip:
      - -e ".[dev]"
