# Conda environment for running IGNITE locally.
# Heavy / compiled packages come from conda-forge. Remaining Python deps
# (and this project in editable mode with test extras) are installed via pip
# so versions stay consistent with pyproject.toml.
#
# pytorch is optional at runtime: the API falls back to the rule-based planner
# when torch or the checkpoint is missing. It is included here so a full local
# install can run the learned planner without a second pip torch install.
name: ignite
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10,<3.13
  - pip
  - numpy>=1.26.0,<3
  - scipy>=1.10.0,<2
  - pandas>=2.0.0,<3
  - joblib>=1.3.0,<2
  - rdkit>=2023.9.1,<2027
  - xgboost>=2.0.0,<4
  - scikit-learn>=1.3.0,<2
  - pytorch>=2.1.0,<3
  - pillow>=10.0.0,<12
  - pip:
      - -e ".[dev]"
